name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm check
      - run: pnpm test
      - run: pnpm --filter web preview:test
      - uses: browser-actions/setup-chrome@v2
        id: chrome
        with:
          install-dependencies: true
      # Hosted runners restrict Chrome's sandbox; these tests visit local fixtures only.
      - run: |
          printf '#!/usr/bin/env bash\nexec %q --no-sandbox "$@"\n' "$CHROME_PATH" > "$RUNNER_TEMP/test-chrome"
          chmod +x "$RUNNER_TEMP/test-chrome"
          CHROME_BIN="$RUNNER_TEMP/test-chrome" node --test "migration/tools/**/*.test.mjs"
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
      - run: |
          python3 -I migration/tools/import/assets_test.py
          python3 -I migration/tools/import/bundle_test.py
          python3 -I migration/tools/import/pages_test.py
      - run: pnpm --filter web exec tsc --noEmit
      - run: pnpm build
      - run: python3 -I migration/tools/tasks.py check

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web exec playwright install --with-deps --only-shell chromium
      - run: pnpm --filter web build
      - run: pnpm --filter web e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: apps/web/.wrangler/e2e/
          include-hidden-files: true
          retention-days: 14

  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: browser-actions/setup-chrome@v2
        id: chrome
        with:
          install-dependencies: true
          chrome-version: 158.0.8127.18
      - name: Audit static build through local Worker
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          set -euo pipefail
          export VERIFY_WEB_HOME="$RUNNER_TEMP/t80-verify-web"
          web=.claude/skills/verify-web/scripts/web.sh
          trap '"$web" down --port 8790' EXIT
          "$web" up --port 8790
          "$web" doctor --port 8790
          for path in / /blog /blog/automatyzacja-sprzedazy /audyt-ai-sprzedaz /kontakt /newsletter; do
            "$web" probe "$path" --port 8790
          done
          pnpm --filter web exec lhci collect
          node apps/web/lighthouserc-summary.mjs
          pnpm --filter web exec lhci assert --includePassedAssertions
      - name: Export Lighthouse HTML and JSON reports
        if: always()
        run: pnpm --filter web exec lhci upload
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-reports
          path: |
            apps/web/.lighthouseci/
            apps/web/.wrangler/lighthouse/
            ${{ runner.temp }}/t80-verify-web/evidence/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
